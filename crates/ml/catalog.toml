# Suggested models for Photoka's AI generation mode (Model Manager › Suggested).
#
# Nothing here is downloaded until the user clicks Download and accepts the entry's license.
# Every entry is pinned: `size` is the exact byte count and `sha256` the hash of the file, and the
# download fails if either doesn't match. Civitai files need the user's own Civitai API key
# (`requires_key`). Checked against the sources on 2026-10-13; `crates/ml/src/catalog.rs` tests
# that every entry is complete.

version = 1

