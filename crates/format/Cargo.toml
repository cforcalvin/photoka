[package]
name = "photoka-format"
description = "Native .photoka document bundle: manifest + content-addressed zstd tiles"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
photoka-geom = { workspace = true }
photoka-color = { workspace = true }
photoka-raster = { workspace = true }
photoka-doc = { workspace = true }
photoka-codecs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["unbounded_depth"] }
thiserror = { workspace = true }
flate2 = { workspace = true }
# Same IEEE CRC-32 the ZIP container needs; already in Cargo.lock through flate2.
crc32fast = "1.5"
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
ruzstd = "0.9"

# A plain fsync where a file system refuses the full flush (`sync_file`, atomic.rs). Already in
# Cargo.lock on Apple targets (cap-std), so this adds no new crate.
[target.'cfg(target_vendor = "apple")'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }

[dev-dependencies]
proptest = { workspace = true }
