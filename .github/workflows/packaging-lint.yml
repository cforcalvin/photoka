# Quick static checks for the release pipeline (seconds, no Rust build): workflow syntax and the
# packaging shell scripts.
name: Packaging lint

on:
  push:
    branches: [main, release]
    paths: [".github/workflows/**", "packaging/**"]
  pull_request:
    paths: [".github/workflows/**", "packaging/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: actionlint + shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # actionlint runs shellcheck on every `run:` block too (shellcheck is on the runner image).
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
      - name: shellcheck
        run: shellcheck -x packaging/*.sh packaging/macos/*.sh scripts/*.sh examples/plugins/*/build.sh
      - name: plists
        run: |
          python3 - <<'EOF'
          import plistlib
          for f in ["packaging/macos/entitlements.plist", "packaging/macos/Info.plist.in"]:
              with open(f, "rb") as fh:
                  plistlib.load(fh)
          print("plists ok")
          EOF
