[package]
name = "photoka-cli"
description = "Headless Photoka: convert, inspect, run commands, batch, MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Open HEIC/HEIF photos (the optional photoka-heif crate). Not default so distributors choose
# it; official builds (CI, packaging/, release) build with `--features heif`.
heif = ["photoka-codecs/heif"]

[lints]
workspace = true

[lib]
name = "photoka_cli"
path = "src/lib.rs"

[[bin]]
name = "photoka-cli"
path = "src/main.rs"

[dependencies]
photoka-automation = { path = "../../crates/automation" }
photoka-engine = { workspace = true }
photoka-io = { workspace = true }
photoka-format = { path = "../../crates/format" }
photoka-codecs = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
